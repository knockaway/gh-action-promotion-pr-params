name: CI
on:
  pull_request:
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm test

      - run: npm run build

      # Fails the PR if dist/ wasn't rebuilt to match index.js — the bundled
      # output is what consumers actually run, so source/dist drift = action
      # silently runs stale code at the next tag.
      - name: Verify dist/ is up to date
        run: |
          if ! git diff --exit-code dist/; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
